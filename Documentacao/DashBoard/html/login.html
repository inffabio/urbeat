<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Brasa Burguer | Login
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="assets/styles.css" rel="stylesheet"/>
 </head>
 <body class="login-page">
  <div class="login-card">
   <img alt="Brasa Burguer" class="login-logo" src="assets/logo.png"/>
   <h1 class="h3 fw-bold text-center">
    Entrar no painel
   </h1>
   <p class="text-secondary text-center fw-semibold mb-4">
    Acesse sua conta Brasa Burguer
   </p>
   <div class="mb-3">
    <label class="form-label-app">
     E-mail
    </label>
    <input class="form-control-app" value="admin@brasaburguer.com"/>
   </div>
   <div class="mb-4">
    <label class="form-label-app">
     Senha
    </label>
    <input class="form-control-app" type="password" value="123456"/>
   </div>
   <a class="btn-primary-app btn-orange w-100" href="index.html">
    Entrar
   </a>
  </div>
 </body>
</html>
