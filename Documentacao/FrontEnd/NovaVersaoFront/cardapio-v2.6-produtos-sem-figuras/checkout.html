<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout • Brasa Burger</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Line Icons -->
<link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet"/>
<!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/styles.css">

  <style>
    body,
    button,
    input,
    textarea {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .circle-btn i,
    .mini-summary i,
    .field i,
    .disabled i {
      line-height: 1;
    }

    .circle-btn i {
      font-size: 25px;
    }

    .mini-summary .left i {
      color: var(--orange);
      font-size: 28px;
    }

    .field {
      grid-template-columns: 42px 1fr;
    }

    .field i {
      color: #7a513e;
      font-size: 23px;
      text-align: center;
    }

    .field input::placeholder {
      color: #9b8f88;
    }

    .checkout-logo img {
      box-shadow: 0 18px 36px rgba(88, 36, 12, 0.10);
      background: #fff;
    }

    .mini-summary {
      box-shadow: 0 14px 32px rgba(71, 39, 20, 0.08);
    }

    /* Botão sem sombreamento */
    .disabled {
      box-shadow: none !important;
      margin-top: 26px;
      margin-bottom: 0;
    }

    .disabled i {
      font-size: 20px;
      margin-right: 8px;
      vertical-align: -2px;
    }

    /* Espaço abaixo do botão e link centralizado */
    .link-orange {
      display: block;
      text-align: center;
      width: 100%;
      margin: 24px 0 26px;
      color: var(--orange);
      font-size: 20px;
      font-weight: 800;
    }

    /* Footer com nome da loja, sem ícone, cinza e sem negrito */
    .store-footer {
      height: 84px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid rgba(234, 223, 214, 0.9);
      box-shadow: 0 -14px 30px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      bottom: 0;
      z-index: 30;
      border-radius: 26px 26px 0 0;
      color: #8a8a90;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .screen-padding {
      padding-bottom: 0;
    }

    @media (max-width: 400px) {
      .checkout-title {
        font-size: 32px;
      }

      .checkout-logo img {
        width: 126px;
        height: 126px;
      }

      .field {
        height: 60px;
        grid-template-columns: 38px 1fr;
      }

      .field input {
        font-size: 17px;
      }

      .link-orange {
        font-size: 18px;
        margin-bottom: 22px;
      }
    }
  </style>
</head>
<body>
<main class="app-shell">
  <div class="statusbar">
    <span>9:41</span>
    <div class="status-icons">
      <span class="signal"><i></i><i></i><i></i><i></i></span>
      <span class="wifi"></span>
      <span class="battery"></span>
    </div>
  </div>

  <section class="screen-padding">
    <a class="circle-btn" data-back href="carrinho.html" aria-label="Voltar">
      <i class="bi bi-arrow-left icon"></i>
    </a>

    <div class="checkout-logo">
      <img src="assets/images/logo.png" alt="Logo Brasa Burger">
    </div>

    <h1 class="checkout-title">Brasa Burger</h1>

    <div class="mini-summary card">
      <div class="left">
        <i class="bi bi-bag" aria-hidden="true"></i>
        <span>4 itens</span>
      </div>
      <strong class="price">R$ 60,90</strong>
    </div>

    <form class="form-list">
      <label class="field">
        <i class="bi bi-person" aria-hidden="true"></i>
        <input placeholder="Nome completo" autocomplete="name">
      </label>

      <label class="field">
        <i class="bi bi-telephone" aria-hidden="true"></i>
        <input placeholder="(22)99999-9999" autocomplete="tel">
      </label>

      <label class="field">
        <i class="bi bi-envelope" aria-hidden="true"></i>
        <input placeholder="email" autocomplete="email">
      </label>

      <label class="field">
        <i class="bi bi-geo-alt" aria-hidden="true"></i>
        <input placeholder="CEP" autocomplete="postal-code">
      </label>

      <label class="field">
        <i class="bi bi-buildings" aria-hidden="true"></i>
        <input placeholder="Cidade" autocomplete="address-level2">
      </label>

      <label class="field">
        <i class="bi bi-map" aria-hidden="true"></i>
        <input placeholder="Bairro" autocomplete="address-level3">
      </label>

      <label class="field">
        <i class="fa-solid fa-road" aria-hidden="true"></i>
        <input placeholder="Rua" autocomplete="address-line1">
      </label>

      <label class="field">
        <i class="bi bi-hash" aria-hidden="true"></i>
        <input placeholder="Número" autocomplete="address-line2">
      </label>

      <label class="field">
        <i class="bi bi-chat-left-text" aria-hidden="true"></i>
        <input placeholder="Complemento">
      </label>

      <button class="disabled" type="button">
        <i class="bi bi-lock" aria-hidden="true"></i>
        Continuar
      </button>
    </form>

    <a class="link-orange" href="index.html">Voltar ao cardápio</a>
  </section>

  <footer class="footer-nav" aria-label="Navegação principal">
    <a href="index.html">
      <i class="bi bi-shop-window" aria-hidden="true"></i>
      <span>Cardápio</span>
    </a>
    <a href="confirmado.html">
      <i class="bi bi-receipt-cutoff" aria-hidden="true"></i>
      <span>Pedidos</span>
    </a>
    <a class="active" href="carrinho.html" aria-current="page">
      <i class="bi bi-bag-check" aria-hidden="true"></i>
      <span>Carrinho</span>
    </a>
    <a href="checkout.html">
      <i class="bi bi-person-circle" aria-hidden="true"></i>
      <span>Conta</span>
    </a>
  </footer>
<script src="js/app.js"></script>
</main>
</body>
</html>
