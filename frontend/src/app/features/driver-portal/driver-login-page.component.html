<main class="driver-auth">
  <section class="driver-auth-card" aria-labelledby="driver-login-title">
    <div class="driver-auth-brand" aria-hidden="true">urbeat</div>
    <span class="driver-auth-kicker">Portal do entregador</span>
    <h1 id="driver-login-title">Entre para ver suas entregas</h1>
    <p class="driver-auth-copy">
      Use o e-mail convidado por uma loja. Cada loja vê apenas os próprios pedidos.
    </p>

    <form class="driver-auth-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          placeholder="voce@exemplo.com"
          [attr.aria-invalid]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <small class="field-error">Informe um e-mail válido.</small>
        }
      </label>

      <label class="field">
        <span>Senha</span>
        <span class="password-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            [attr.aria-invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
          />
          <button type="button" class="password-toggle" (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </span>
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <small class="field-error">A senha deve ter pelo menos 8 caracteres.</small>
        }
      </label>

      @if (error(); as message) {
        <p class="driver-auth-error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="driver-auth-submit" [disabled]="loading()" [attr.aria-busy]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="driver-auth-hint">
      Ainda não recebeu o convite? Peça para a loja reenviar pelo painel de entregadores.
    </p>
  </section>
</main>
