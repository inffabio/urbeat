<form class="password-form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="new-password">Nova senha</label>
    <div class="input-shell">
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        [attr.type]="showPassword() ? 'text' : 'password'"
        [value]="newPassword()"
        [attr.aria-describedby]="'password-policy password-error'"
        [attr.aria-invalid]="touched() && !isValid()"
        (input)="onPasswordInput($event)"
        (blur)="markTouched()"
        required
      />
      <button
        type="button"
        class="toggle"
        (click)="toggleVisibility()"
        [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="showPassword()"
      >
        {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
  </div>

  <div class="field">
    <label for="confirm-password">Confirmar nova senha</label>
    <div class="input-shell">
      <input
        id="confirm-password"
        [attr.type]="showPassword() ? 'text' : 'password'"
        autocomplete="new-password"
        [value]="confirmPassword()"
        [attr.aria-invalid]="showMismatch()"
        (input)="onConfirmInput($event)"
        (blur)="markTouched()"
        required
      />
    </div>
  </div>

  <ul id="password-policy" class="policy" aria-label="Requisitos da senha">
    <li [class.is-met]="hasMinLength()">Mínimo de 8 caracteres</li>
    <li [class.is-met]="hasUppercase()">Uma letra maiúscula</li>
    <li [class.is-met]="hasLowercase()">Uma letra minúscula</li>
    <li [class.is-met]="hasDigit()">Um número</li>
  </ul>

  @if (showMismatch()) {
    <p id="password-error" class="error" role="alert">As senhas não coincidem.</p>
  }

  @if (serverError(); as error) {
    <p class="error" role="alert" aria-live="polite">{{ error }}</p>
  }

  <button type="submit" class="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
    {{ busy() ? 'Salvando…' : submitLabel() }}
  </button>
</form>
