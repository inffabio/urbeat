# ─────────────────────────────────────────────────────────────
# Docker Compose para Ambiente de Desenvolvimento Local / Interno
# ─────────────────────────────────────────────────────────────
# Este arquivo é otimizado para desenvolvimento, com logs detalhados,
# hot-reload (se configurado) e sem HTTPS/Certbot.
# ─────────────────────────────────────────────────────────────

volumes:
  pgdata:
  redis-data:
  grafana-data:
  prometheus-data:
  frontend-assets:

networks:
  urbeat_net:
    driver: bridge

services:
  # ───────── POSTGRES ─────────
  db:
    image: postgres:16-alpine
    container_name: urbeat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: UrbeatDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - urbeat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UrbeatDb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ───────── REDIS ─────────
  redis:
    image: redis:7-alpine
    container_name: urbeat_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - urbeat_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ───────── BACKEND .NET 9 (Development) ─────────
  webapi:
    build:
      context: ../backend
      dockerfile: src/Urbeat.WebApi/Dockerfile
    image: urbeat/webapi:latest
    container_name: urbeat_webapi
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      TZ: America/Sao_Paulo
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=UrbeatDb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;SSL Mode=Disable;Trust Server Certificate=true"
      Serilog__WriteTo__1__Args__connectionString: "Host=db;Port=5432;Database=UrbeatLogs;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable;Trust Server Certificate=true"
      Redis__ConnectionString: "redis:6379"
      Jwt__Issuer: "urbeat"
      Jwt__Audience: "urbeat-api"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_MINIMUM_32_CHARS_SECRET_DEV_VALUE}"
      Jwt__ExpirationMinutes: "60"
      Jwt__RefreshTokenDays: "7"
      AdminSeed__Email: "${ADMIN_EMAIL:-admin@urbeat.local}"
      AdminSeed__Password: "${ADMIN_PASSWORD:-Admin12345}"
      Hangfire__DashboardUser: "${HANGFIRE_USER:-admin}"
      Hangfire__DashboardPassword: "${HANGFIRE_PASSWORD:-urbeat-hangfire}"
      Encryption__Key: "${ENCRYPTION_KEY:-CHANGE_ME_MINIMUM_32_CHARS_ENCRYPTION_KEY}"
      EmailConfirmation__FrontendBaseUrl: "${FRONTEND_BASE_URL:-http://localhost}"
      Email__FromAddress: "${SMTP_FROM:-contato@urbeat.com.br}"
      Email__FromName: "Urbeat"
      Email__LogOnly: "${EMAIL_LOGONLY:-false}"
      Email__Smtp__Host: "${SMTP_HOST}"
      Email__Smtp__Port: "${SMTP_PORT:-587}"
      Email__Smtp__Username: "${SMTP_USER}"
      Email__Smtp__Password: "${SMTP_PASSWORD}"
      Email__Smtp__UseStartTls: "${SMTP_SSL:-true}"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET}"
      CustomerVerification__Channel: "${CUSTOMER_VERIFICATION_CHANNEL:-Sms}"
      CustomerVerification__SmsProvider: "${CUSTOMER_VERIFICATION_SMS_PROVIDER:-Fake}"
      CustomerVerification__Infobip__BaseUrl: "${INFOBIP_BASE_URL}"
      CustomerVerification__Infobip__ApiKey: "${INFOBIP_API_KEY}"
      CustomerVerification__Infobip__Sender: "${INFOBIP_SENDER:-Urbeat}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbeat_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ───────── FRONTEND ANGULAR BUILD ─────────
  frontend_build:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: urbeat/frontend:latest
    container_name: urbeat_frontend_build
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "[frontend_build] sincronizando assets..."
        rm -rf /shared/*
        cp -r /app/dist/. /shared/
        echo "[frontend_build] OK ($(ls /shared | wc -l) entradas)"
    volumes:
      - frontend-assets:/shared
    networks:
      - urbeat_net
    restart: "no"

  # ───────── NGINX (HTTP Only for Local/Internal) ─────────
  nginx:
    image: nginx:1.27-alpine
    container_name: urbeat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend-assets:/usr/share/nginx/html:ro
    depends_on:
      - webapi
      - frontend_build
    networks:
      - urbeat_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ───────── MONITORING (Optional for Local Dev) ─────────
  prometheus:
    image: prom/prometheus:latest
    container_name: urbeat_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - urbeat_net

  grafana:
    image: grafana/grafana:latest
    container_name: urbeat_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - urbeat_net

  nodeexporter:
    image: prom/node-exporter:latest
    container_name: urbeat_nodeexporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - urbeat_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: urbeat_postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/UrbeatDb?sslmode=disable"
    depends_on:
      - db
    networks:
      - urbeat_net
