# ─────────────────────────────────────────────────────────────
# HTTP (porta 80)
# Serve /.well-known/acme-challenge para renovacao do cert.
# Redireciona tudo para HTTPS.
# ─────────────────────────────────────────────────────────────

# ─── urbeat.com.br + www ───
server {
    listen 80;
    listen [::]:80;
    server_name urbeat.com.br www.urbeat.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── api.urbeat.com.br (sem cert ainda; segue HTTP fallback) ───
server {
    listen 80;
    listen [::]:80;
    server_name api.urbeat.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://urbeat_webapi;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}

# ─── Default (IP direto) ───
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Landpage Angular SPA (mesmo via IP)
    location = /landpage/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /landpage/ {
        rewrite ^/landpage/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://urbeat_webapi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://urbeat_webapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /health   { proxy_pass http://urbeat_webapi; }
    location /swagger  { proxy_pass http://urbeat_webapi; proxy_set_header Host $host; }
    location /hangfire { proxy_pass http://urbeat_webapi; proxy_set_header Host $host; }
}