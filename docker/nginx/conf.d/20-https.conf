# ─────────────────────────────────────────────────────────────
# HTTPS (porta 443)
# Cert Let's Encrypt para urbeat.com.br + www
# ─────────────────────────────────────────────────────────────

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name urbeat.com.br www.urbeat.com.br;

    ssl_certificate     /etc/letsencrypt/live/urbeat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urbeat.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Landpage estática (vendedor / institucional) ───
    location /landpage/ {
        alias /var/www/landpage/;
        index index.html;
        try_files $uri $uri/ /landpage/index.html;
        expires $expires;

        # Cache forte para assets versionados; HTML não cacheia
        location ~* \.html?$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires epoch;
        }
        location ~* \.(css|js|png|jpe?g|svg|gif|webp|woff2?)$ {
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
        }
    }

    # /landpage (sem barra) -> redireciona pra /landpage/
    location = /landpage {
        return 301 /landpage/;
    }

    # ─── Frontend SPA ───
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        expires $expires;
        try_files $uri $uri/ /index.html;
    }

    # ─── Backend API ───
    location /api/ {
        proxy_pass         http://urbeat_webapi;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
    }

    location /hubs/ {
        proxy_pass         http://urbeat_webapi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass         http://urbeat_webapi;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /swagger {
        proxy_pass         http://urbeat_webapi;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /hangfire {
        proxy_pass         http://urbeat_webapi;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
    }
}