# ─────────────────────────────────────────────────────────────
# Upstreams compartilhados
# ─────────────────────────────────────────────────────────────
upstream urbeat_webapi {
    least_conn;
    server webapi:8080 max_fails=3 fail_timeout=10s;
    server webapi_replica_2:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Bloco reutilizável: proxy padrão pro backend
# Usado via `include /etc/nginx/snippets/proxy-webapi.conf;`
# (não fazemos include aqui porque dá conflito com server{}, ver vhosts)
