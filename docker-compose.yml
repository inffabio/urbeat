# ═══════════════════════════════════════════════════════════
# URBEAT - LOCAL DEVELOPMENT DOCKER COMPOSE
# Run with: docker compose up --build
# ═══════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: urbeat_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: UrbeatDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UrbeatDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: urbeat_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── .NET 9 Backend API ──────────────────────────────────
  webapi:
    build:
      context: ./backend
      dockerfile: src/Urbeat.WebApi/Dockerfile
    container_name: urbeat_webapi_dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=UrbeatDb;Username=postgres;Password=postgres;SSL Mode=Disable;"
      Redis__ConnectionString: "redis:6379"
      Jwt__Secret: "CHANGE_ME_MINIMUM_32_CHARS_SECRET_DEV_VALUE_1234"
      Jwt__Issuer: "urbeat"
      Jwt__Audience: "urbeat-api"
      Jwt__ExpirationMinutes: "60"
      Email__LogOnly: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/src  # Hot reload for development (requires dotnet watch in Dockerfile or local dev)

  # ─── Angular/Ionic Frontend ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbeat_frontend_dev
    restart: unless-stopped
    ports:
      - "4200:80" # Exposes the built static files via a lightweight internal server if added, or just for volume mapping
    volumes:
      - frontend_assets:/usr/share/nginx/html

volumes:
  pgdata_dev:
  frontend_assets:
